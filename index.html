<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilab — Умный калькулятор девайсов</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M24 16 V48 M24 16 H34 A8 8 0 0 1 34 32 H24 M24 32 H36 A8 8 0 0 1 36 48 H24' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<meta name="theme-color" content="#8b5cf6">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root[data-theme="dark"] {
  --bg-1:#08080d;--bg-2:#10101a;
  --orb-1:rgba(139,92,246,.28);--orb-2:rgba(6,182,212,.22);--orb-3:rgba(236,72,153,.14);
  --card:rgba(255,255,255,.035);--card-hover:rgba(255,255,255,.055);--card-solid:#15151f;
  --border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.16);
  --text:#f4f4f7;--text-dim:#9ca3af;--text-dimmer:#6b7280;
  --accent:#8b5cf6;--accent-2:#06b6d4;--accent-soft:rgba(139,92,246,.14);--accent-glow:rgba(139,92,246,.4);
  --error:#f87171;--error-soft:rgba(248,113,113,.12);
  --success:#34d399;--success-soft:rgba(52,211,153,.12);
  --warning:#fbbf24;--warning-soft:rgba(251,191,36,.12);
  --input-bg:rgba(255,255,255,.04);--input-bg-focus:rgba(255,255,255,.09);
  --shadow:0 25px 50px -12px rgba(0,0,0,.6);
}
:root[data-theme="light"] {
  --bg-1:#f6f4ff;--bg-2:#eefaff;
  --orb-1:rgba(139,92,246,.35);--orb-2:rgba(6,182,212,.3);--orb-3:rgba(236,72,153,.18);
  --card:rgba(255,255,255,.7);--card-hover:rgba(255,255,255,.9);--card-solid:#fff;
  --border:rgba(15,15,30,.07);--border-strong:rgba(15,15,30,.14);
  --text:#14142b;--text-dim:#52525b;--text-dimmer:#71717a;
  --accent:#7c3aed;--accent-2:#0891b2;--accent-soft:rgba(124,58,237,.09);--accent-glow:rgba(124,58,237,.25);
  --error:#dc2626;--error-soft:rgba(220,38,38,.08);
  --success:#059669;--success-soft:rgba(5,150,105,.09);
  --warning:#d97706;--warning-soft:rgba(217,119,6,.09);
  --input-bg:rgba(15,15,30,.035);--input-bg-focus:rgba(15,15,30,.07);
  --shadow:0 25px 50px -12px rgba(80,80,120,.18);
}
*{box-sizing:border-box;margin:0;padding:0;outline:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;color:var(--text);
  background:linear-gradient(135deg,var(--bg-1) 0%,var(--bg-2) 100%);
  min-height:100vh;overflow-x:hidden;transition:background .4s,color .3s;
  font-feature-settings:'cv11','ss01';-webkit-font-smoothing:antialiased;
}
.bg-orbs{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(100px);will-change:transform;transition:transform .1s linear}
.orb-1{width:500px;height:500px;top:-150px;left:-100px;background:var(--orb-1);animation:float1 22s ease-in-out infinite}
.orb-2{width:460px;height:460px;bottom:-140px;right:-80px;background:var(--orb-2);animation:float2 26s ease-in-out infinite}
.orb-3{width:380px;height:380px;top:40%;left:45%;background:var(--orb-3);animation:float3 30s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(80px,60px) scale(1.15)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,-50px) scale(1.2)}}
@keyframes float3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,50px) scale(.9)}}
.app{position:relative;z-index:1;max-width:1140px;margin:0 auto;padding:28px 24px 60px}

.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;animation:fadeDown .5s both}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.brand-mark{
  width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 8px 24px var(--accent-glow);
  position:relative;
}
.brand-mark::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.3),transparent);pointer-events:none}
.brand-mark svg{width:20px;height:20px}
.brand-text{background:linear-gradient(135deg,var(--text),var(--text-dim));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-badge{font-size:.62rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);letter-spacing:.08em;text-transform:uppercase;border:1px solid rgba(139,92,246,.25)}
.topbar-actions{display:flex;align-items:center;gap:8px}
.icon-btn{
  width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--border);
  color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;backdrop-filter:blur(12px);
}
.icon-btn:hover{color:var(--text);background:var(--card-hover);border-color:var(--border-strong);transform:translateY(-1px)}
.icon-btn svg{width:18px;height:18px}
.lang-btn{width:auto;padding:0 12px;gap:8px;font-family:inherit;font-size:.78rem;font-weight:700}
.lang-btn .fi{font-size:1.05em;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
@media (max-width:420px){.lang-btn .lang-code{display:none}}

.layout{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}

/* ═══ ГОТОВЫЕ СБОРКИ ═══ */
.builds-section{margin-bottom:22px;animation:fadeUp .5s both;animation-delay:.05s}
.builds-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.builds-title{font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:8px;letter-spacing:-.02em}
.builds-title svg{width:18px;height:18px;color:var(--accent)}
.builds-sub{font-size:.75rem;color:var(--text-dimmer);font-weight:500;margin-top:4px}

.builds-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:820px){.builds-grid{grid-template-columns:1fr}}

.build-card{
  position:relative;background:var(--card);border:1px solid var(--border);border-radius:20px;
  overflow:hidden;cursor:pointer;
  transition:all .28s cubic-bezier(.34,1.4,.64,1);
  display:flex;flex-direction:column;
}
.build-card:hover{transform:translateY(-6px);border-color:var(--border-strong);box-shadow:0 20px 40px -16px var(--accent-glow)}
.build-card:hover .build-img img{transform:scale(1.08)}
.build-card.popular{border-color:rgba(139,92,246,.35)}

.build-img{
  position:relative;aspect-ratio:16/10;width:100%;
  background:linear-gradient(135deg,#1a1a25,#0f0f18);overflow:hidden;
}
.build-img img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .6s cubic-bezier(.34,1.4,.64,1);
  filter:brightness(.9) saturate(1.1);
}
.build-img::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.72) 100%);
}
.build-badge{
  position:absolute;top:12px;left:12px;z-index:2;
  font-size:.6rem;font-weight:800;padding:4px 9px;border-radius:7px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;letter-spacing:.06em;text-transform:uppercase;
  box-shadow:0 4px 12px rgba(0,0,0,.35);
}
.build-badge.hot{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.build-badge.pro{background:linear-gradient(135deg,#ec4899,#8b5cf6)}

.build-title-overlay{
  position:absolute;bottom:10px;left:14px;right:14px;z-index:2;
  display:flex;align-items:flex-end;justify-content:space-between;gap:8px;
}
.build-title{font-size:1rem;font-weight:800;color:#fff;letter-spacing:-.02em;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.build-price{
  font-size:1.05rem;font-weight:800;color:#fff;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,#fff,#a5b4fc);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 2px 8px rgba(0,0,0,.4);
  white-space:nowrap;
}

.build-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.build-desc{font-size:.72rem;color:var(--text-dimmer);font-weight:500;line-height:1.4}

.build-parts{display:flex;flex-direction:column;gap:5px;font-size:.72rem}
.build-part{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.build-part-key{
  color:var(--text-dimmer);font-weight:600;flex-shrink:0;
  display:flex;align-items:center;gap:5px;
}
.build-part-key svg{width:11px;height:11px;opacity:.7}
.build-part-val{
  color:var(--text-dim);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;
}

.build-total{
  display:flex;justify-content:space-between;align-items:center;
  padding-top:10px;margin-top:auto;border-top:1px dashed var(--border);
  font-size:.8rem;font-weight:700;color:var(--text-dim);
}
.build-total strong{color:var(--accent);font-size:1.1rem;font-variant-numeric:tabular-nums}

.build-apply{
  padding:11px;border-radius:12px;border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;font-family:inherit;font-weight:700;font-size:.82rem;
  cursor:pointer;transition:all .2s cubic-bezier(.34,1.4,.64,1);
  display:flex;align-items:center;justify-content:center;gap:7px;
  box-shadow:0 6px 16px -6px var(--accent-glow);
}
.build-apply:hover{transform:translateY(-2px);filter:brightness(1.1);box-shadow:0 10px 22px -8px var(--accent-glow)}
.build-apply:active{transform:translateY(0)}
.build-apply svg{width:14px;height:14px}

/* ═══ DEVICES HEADER ═══ */
.devices-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;animation:fadeUp .5s both;animation-delay:.08s;
}
.devices-count{font-size:.75rem;color:var(--text-dimmer);font-weight:600}
.devices-count strong{color:var(--accent);font-weight:700}
.devices-actions{display:flex;gap:6px}
.dev-action{
  padding:6px 12px;border-radius:9px;background:var(--input-bg);
  border:1px solid transparent;color:var(--text-dim);
  font-family:inherit;font-size:.7rem;font-weight:600;
  cursor:pointer;transition:all .18s;
}
.dev-action:hover{color:var(--accent);background:var(--accent-soft);border-color:rgba(139,92,246,.2)}

.devices{display:flex;flex-direction:column;gap:8px;animation:fadeUp .5s both;animation-delay:.1s}
.device{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  backdrop-filter:blur(12px);transition:all .22s cubic-bezier(.34,1.4,.64,1);
  position:relative;overflow:hidden;
}
.device::before{
  content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;
  background:linear-gradient(180deg,var(--accent),var(--accent-2));
  opacity:0;transition:opacity .2s;border-radius:2px;
}
.device:focus-within{background:var(--card-hover);box-shadow:0 12px 28px -12px var(--accent-glow)}
.device:focus-within::before{opacity:1}
.device.error{border-color:var(--error);background:var(--error-soft);animation:shake .4s}
.device.error::before{background:var(--error);opacity:1}
.device.filled .dev-icon{color:var(--accent);background:var(--accent-soft)}
.device.error .dev-icon{color:var(--error);background:var(--error-soft)}
.device.disabled{opacity:.42;filter:saturate(.4)}
.device.disabled::before{display:none}
.device.disabled .qty-box,
.device.disabled .price-wrap{pointer-events:none;opacity:.6}
.device.disabled .dev-name{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--text-dimmer)}
.device.disabled .suggest-badge{display:none!important}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.device-main{
  display:grid;grid-template-columns:22px 44px 1fr auto auto;
  gap:12px;align-items:center;padding:12px 14px;
}

.dev-check{position:relative;width:22px;height:22px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dev-check input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;z-index:1}
.dev-check-box{
  position:absolute;inset:0;border-radius:50%;
  border:2px solid var(--border-strong);
  background:var(--input-bg);
  transition:all .2s cubic-bezier(.34,1.4,.64,1);
  display:flex;align-items:center;justify-content:center;
}
.dev-check input:checked + .dev-check-box{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border-color:transparent;
  box-shadow:0 4px 12px -2px var(--accent-glow);
}
.dev-check-box::after{
  content:'';width:4px;height:8px;
  border:2px solid #fff;border-top:0;border-left:0;
  transform:rotate(45deg) translate(-1px,-1px);
  opacity:0;transition:opacity .15s;
  margin-top:-2px;
}
.dev-check input:checked + .dev-check-box::after{opacity:1}
.dev-check:hover .dev-check-box{border-color:var(--accent)}
.dev-check input:active + .dev-check-box{transform:scale(.9)}

.dev-icon{width:44px;height:44px;border-radius:13px;background:var(--input-bg);color:var(--text-dimmer);display:flex;align-items:center;justify-content:center;transition:all .2s}
.dev-icon svg{width:20px;height:20px}
.dev-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.dev-name{font-size:.92rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
.dev-hint{font-size:.7rem;color:var(--text-dimmer);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:12px;line-height:12px;transition:color .2s}
.dev-hint.active{color:var(--text-dim)}
.dev-hint.error{color:var(--error);font-weight:600}

.qty-box{display:flex;align-items:center;background:var(--input-bg);border-radius:10px;border:1px solid transparent;overflow:hidden;transition:all .2s}
.device:focus-within .qty-box{border-color:var(--border-strong)}
.qty-btn{width:26px;height:36px;border:none;background:transparent;color:var(--text-dimmer);cursor:pointer;font-size:15px;font-weight:600;transition:all .15s;display:flex;align-items:center;justify-content:center;font-family:inherit}
.qty-btn:hover{color:var(--accent);background:var(--accent-soft)}
.qty-btn:active{transform:scale(.9)}
.qty-input{width:32px;height:36px;text-align:center;background:transparent;border:none;color:var(--text);font-size:.85rem;font-weight:700;font-family:inherit;-moz-appearance:textfield;font-variant-numeric:tabular-nums}
.qty-input::-webkit-outer-spin-button,.qty-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.price-wrap{position:relative;width:140px;flex-shrink:0}
.price-input{
  width:100%;padding:11px 30px 11px 12px;background:var(--input-bg);border:1px solid transparent;
  border-radius:11px;color:var(--accent);font-size:1rem;font-weight:700;text-align:right;
  font-family:inherit;font-variant-numeric:tabular-nums;transition:all .2s;
}
.price-input::placeholder{color:var(--text-dimmer);font-weight:500}
.price-input:focus{background:var(--input-bg-focus);border-color:var(--border-strong)}
.device.error .price-input{color:var(--error)}
.currency{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--text-dimmer);font-size:.85rem;font-weight:700;pointer-events:none;transition:color .2s}
.device:focus-within .currency{color:var(--accent)}
.device.error .currency{color:var(--error)}

.suggest-badge{
  position:absolute;top:-7px;right:-7px;
  width:24px;height:24px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border:2px solid var(--card-solid);
  display:none;align-items:center;justify-content:center;
  color:#fff;cursor:pointer;padding:0;
  box-shadow:0 4px 14px var(--accent-glow);
  z-index:3;
  transition:transform .2s cubic-bezier(.34,1.4,.64,1);
  animation:suggestPop .4s cubic-bezier(.34,1.4,.64,1);
}
@keyframes suggestPop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.suggest-badge:hover{transform:scale(1.18)}
.suggest-badge:active{transform:scale(.9)}
.suggest-badge svg{width:12px;height:12px;stroke-width:2.5}
.device.has-price .suggest-badge{display:flex}
.device.suggest-open .suggest-badge{
  background:linear-gradient(135deg,#f59e0b,#ef4444);
  box-shadow:0 4px 14px rgba(245,158,11,.55);
}
.device.suggest-open .suggest-badge svg{transform:rotate(180deg)}

.suggest-panel{
  max-height:0;overflow:hidden;
  transition:max-height .4s cubic-bezier(.4,0,.2,1);
  border-top:0 solid var(--border);
}
.device.suggest-open .suggest-panel{
  max-height:500px;border-top-width:1px;
}
.suggest-inner{padding:14px 16px 16px}
.suggest-title{
  font-size:.7rem;font-weight:700;color:var(--text-dimmer);
  text-transform:uppercase;letter-spacing:.08em;
  display:flex;align-items:center;gap:6px;margin-bottom:10px;
}
.suggest-title svg{width:12px;height:12px;color:var(--warning)}
.suggest-title strong{color:var(--text-dim);font-weight:700;text-transform:none;letter-spacing:0}
.suggest-hint{
  font-size:.68rem;color:var(--text-dimmer);font-weight:500;margin-bottom:10px;
  display:flex;align-items:center;gap:5px;
}
.suggest-hint svg{width:11px;height:11px;color:var(--accent)}
.suggest-list{display:flex;flex-direction:column;gap:6px}

.suggest-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 12px;background:var(--input-bg);border-radius:10px;
  font-size:.8rem;font-weight:500;color:var(--text-dim);
  cursor:pointer;border:1px solid transparent;
  transition:all .18s cubic-bezier(.34,1.4,.64,1);
  animation:suggestItemIn .35s cubic-bezier(.34,1.4,.64,1) both;
  position:relative;overflow:hidden;
}
.suggest-item::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  flex-shrink:0;
  box-shadow:0 0 8px var(--accent-glow);
  transition:transform .2s;
}
.suggest-item:hover{
  background:var(--accent-soft);
  color:var(--text);
  border-color:rgba(139,92,246,.35);
  transform:translateX(2px);
}
.suggest-item:hover::before{transform:scale(1.5)}
.suggest-item:active{transform:translateX(2px) scale(.99)}
@keyframes suggestItemIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}

.sug-info{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.sug-name{font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug-tag{font-size:.65rem;color:var(--text-dimmer);font-weight:500}
.sug-price{
  font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;
  white-space:nowrap;font-size:.85rem;flex-shrink:0;
  display:flex;align-items:center;gap:4px;
}
.sug-price svg{width:12px;height:12px;opacity:0;transition:opacity .2s}
.suggest-item:hover .sug-price svg{opacity:1}

.suggest-item.is-current{
  background:var(--success-soft);
  border-color:rgba(52,211,153,.4);
}
.suggest-item.is-current::before{background:var(--success);box-shadow:0 0 8px var(--success)}
.suggest-item.is-current .sug-price{color:var(--success)}

@media (max-width:640px){
  .device-main{grid-template-columns:22px 40px 1fr auto;gap:10px}
  .dev-icon{width:40px;height:40px}
  .dev-icon svg{width:18px;height:18px}
  .dev-info{grid-column:3/5}
  .qty-box{grid-row:2;grid-column:2;justify-self:start}
  .price-wrap{grid-row:2;grid-column:3/5;width:100%}
}
@media (max-width:380px){.qty-box{display:none}}

.sidebar{position:sticky;top:28px;display:flex;flex-direction:column;gap:16px;animation:fadeUp .5s both;animation-delay:.15s}
@media (max-width:900px){.sidebar{position:static}}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;backdrop-filter:blur(16px)}
.summary-card{display:flex;flex-direction:column;gap:16px}
.field-label{font-size:.7rem;font-weight:700;color:var(--text-dimmer);text-transform:uppercase;letter-spacing:.09em;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.field-label svg{width:12px;height:12px}
.budget-row .price-wrap{width:100%}
.budget-row .price-input{font-size:.9rem;padding:9px 26px 9px 10px}
.progress-track{position:relative;height:8px;border-radius:4px;background:var(--input-bg);overflow:hidden;margin-top:10px}
.progress-fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:4px;transition:width .5s cubic-bezier(.34,1.4,.64,1),background .3s}
.progress-fill.over{background:linear-gradient(90deg,#f59e0b,#ef4444)}
.progress-info{display:flex;justify-content:space-between;font-size:.72rem;color:var(--text-dimmer);font-weight:600;margin-top:8px}
.discount-row{display:flex;align-items:center;gap:8px;background:var(--input-bg);border-radius:12px;padding:4px}
.discount-row .field-label{margin:0 8px 0 10px;flex:1}
.discount-row input{width:60px;padding:9px 10px;text-align:right;background:transparent;border:none;color:var(--accent);font-size:.95rem;font-weight:700;font-family:inherit;font-variant-numeric:tabular-nums}
.discount-row .pct{color:var(--text-dimmer);font-weight:700;padding-right:10px;font-size:.85rem}
.divider{height:1px;background:var(--border)}
.total-block{text-align:center;padding:4px 0}
.total-label{font-size:.68rem;font-weight:700;color:var(--text-dimmer);text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}
.total-value{
  font-size:2.4rem;font-weight:800;letter-spacing:-.03em;line-height:1;display:flex;align-items:baseline;
  justify-content:center;gap:6px;font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,var(--text) 40%,var(--accent) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;transition:all .3s;
}
.total-value.over{background:linear-gradient(135deg,var(--error),#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent}
.total-value .rub{font-size:1.3rem;font-weight:700}
.total-original{font-size:.75rem;color:var(--text-dimmer);font-weight:600;margin-top:8px}
.actions-primary{display:flex;gap:8px}
.btn{
  padding:14px 18px;border:none;border-radius:13px;font-family:inherit;font-weight:700;font-size:.9rem;
  cursor:pointer;transition:all .2s cubic-bezier(.34,1.4,.64,1);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn svg{width:16px;height:16px}
.btn-primary{
  flex:1;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  box-shadow:0 10px 24px -8px var(--accent-glow);position:relative;overflow:hidden;
}
.btn-primary::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.2),transparent);pointer-events:none}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 32px -8px var(--accent-glow);filter:brightness(1.08)}
.btn-primary:active:not(:disabled){transform:translateY(0)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn-secondary{background:var(--input-bg);color:var(--text-dim);border:1px solid var(--border)}
.btn-secondary:hover{color:var(--text);background:var(--card-hover);border-color:var(--border-strong)}
.actions-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mini-btn{
  padding:10px 6px;border-radius:11px;background:var(--input-bg);border:1px solid transparent;
  color:var(--text-dim);font-family:inherit;font-size:.72rem;font-weight:600;cursor:pointer;
  transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:4px;
}
.mini-btn svg{width:15px;height:15px}
.mini-btn:hover{color:var(--accent);background:var(--accent-soft);border-color:rgba(139,92,246,.2);transform:translateY(-2px)}

.history-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.history-head h3{font-size:.72rem;font-weight:700;color:var(--text-dimmer);text-transform:uppercase;letter-spacing:.09em;display:flex;align-items:center;gap:6px}
.history-head h3 svg{width:12px;height:12px}
.history-clear{font-size:.7rem;font-weight:600;color:var(--text-dimmer);background:none;border:none;cursor:pointer;font-family:inherit;transition:color .2s}
.history-clear:hover{color:var(--error)}
.history-empty{text-align:center;color:var(--text-dimmer);font-size:.8rem;padding:18px 0;font-weight:500}
.history-item{
  display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:11px;
  background:var(--input-bg);margin-bottom:6px;cursor:pointer;transition:all .18s;
  border:1px solid transparent;font-family:inherit;color:var(--text);
  width:100%;text-align:left;
}
.history-item:hover{background:var(--accent-soft);border-color:rgba(139,92,246,.25);transform:translateX(2px)}
.history-item:last-child{margin-bottom:0}
.hi-left{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.hi-time{font-size:.68rem;color:var(--text-dimmer);font-weight:600}
.hi-count{font-size:.72rem;color:var(--text-dim);font-weight:600}
.hi-total{font-size:.88rem;font-weight:800;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}

.modal{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);backdrop-filter:blur(14px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;visibility:hidden;transition:all .28s;
}
.modal.active{opacity:1;visibility:visible}
.modal-box{
  background:var(--card-solid);border:1px solid var(--border-strong);border-radius:26px;
  padding:30px 26px;width:100%;max-width:440px;max-height:90vh;
  display:flex;flex-direction:column;box-shadow:var(--shadow);
  transform:scale(.94) translateY(10px);
  transition:transform .35s cubic-bezier(.34,1.4,.64,1);
}
.modal.active .modal-box{transform:scale(1) translateY(0)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.modal-title{font-size:.72rem;font-weight:700;color:var(--text-dimmer);text-transform:uppercase;letter-spacing:.12em;display:flex;align-items:center;gap:6px}
.modal-title svg{width:13px;height:13px}
.modal-close{width:30px;height:30px;border-radius:9px;border:none;background:var(--input-bg);color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.modal-close:hover{background:var(--error-soft);color:var(--error)}
.modal-close svg{width:15px;height:15px}
.modal-total{text-align:center;padding:8px 0 24px}
.modal-total-value{
  font-size:3rem;font-weight:800;letter-spacing:-.035em;line-height:1;display:flex;align-items:baseline;justify-content:center;gap:8px;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,var(--text) 30%,var(--accent) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.modal-total-value .rub{font-size:1.6rem;font-weight:700}
.modal-total-note{font-size:.78rem;color:var(--text-dimmer);font-weight:600;margin-top:8px}
.modal-total-note strong{color:var(--success);font-weight:700}

.chart-container{display:flex;justify-content:center;margin-bottom:20px;position:relative;width:120px;height:120px;margin-left:auto;margin-right:auto}
.chart-svg{transform:rotate(-90deg);width:100%;height:100%}
.chart-segment{
  fill:none;stroke-width:8;stroke-linecap:round;
  animation-name:chartSeg;
  animation-timing-function:cubic-bezier(.34,1.4,.64,1);
  animation-fill-mode:both;
}
@keyframes chartSeg{from{stroke-dasharray:0 100}}
.chart-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:.7rem;color:var(--text-dimmer);font-weight:600;text-align:center}

.breakdown{max-height:260px;overflow-y:auto;padding-right:6px;margin-bottom:22px}
.breakdown::-webkit-scrollbar{width:4px}
.breakdown::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:2px}

.bd-row{
  display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--border);font-size:.85rem;
  animation:bdRowIn .6s cubic-bezier(.34,1.4,.64,1) both;
}
.bd-row:last-child{border-bottom:none}
@keyframes bdRowIn{
  0%{opacity:0;transform:translateX(-32px) scale(.92);filter:blur(5px)}
  55%{opacity:1;transform:translateX(5px) scale(1.015);filter:blur(0)}
  100%{opacity:1;transform:translateX(0) scale(1)}
}
.bd-thumb{
  width:56px;height:56px;border-radius:12px;
  background:var(--input-bg);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;flex-shrink:0;
  animation:bdThumbIn .7s cubic-bezier(.34,1.4,.64,1) both;
  border:1px solid var(--border);
}
@keyframes bdThumbIn{
  0%{transform:scale(0) rotate(-30deg);opacity:0}
  60%{transform:scale(1.1) rotate(4deg);opacity:1}
  100%{transform:scale(1) rotate(0);opacity:1}
}
.bd-thumb img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.bd-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.bd-name{font-weight:600;color:var(--text);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-bar{height:3px;background:var(--input-bg);border-radius:2px;overflow:hidden}
.bd-bar-fill{
  height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));
  border-radius:2px;width:0;
  animation:barGrow 1s cubic-bezier(.34,1.4,.64,1) both;
}
@keyframes barGrow{
  0%{width:0}
  70%{width:calc(var(--pct) * 1.06)}
  100%{width:var(--pct)}
}
.bd-val{
  font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;font-size:.85rem;white-space:nowrap;
  animation:bdValIn .5s cubic-bezier(.34,1.4,.64,1) both;
}
@keyframes bdValIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}

.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions .btn{padding:13px;font-size:.83rem}

.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:var(--card-solid);border:1px solid var(--border-strong);color:var(--text);
  padding:12px 18px;border-radius:14px;font-size:.85rem;font-weight:600;font-family:inherit;
  display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);
  animation:toastIn .32s cubic-bezier(.34,1.4,.64,1);pointer-events:auto;
}
.toast svg{width:16px;height:16px}
.toast.success svg{color:var(--success)}
.toast.error svg{color:var(--error)}
.toast.info svg{color:var(--accent)}
.toast.out{animation:toastOut .24s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateY(12px) scale(.95)}}

#confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}
@keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.footer-note{text-align:center;margin-top:40px;font-size:.72rem;color:var(--text-dimmer);font-weight:500}
.footer-note kbd{font-family:inherit;font-size:.68rem;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--input-bg);border:1px solid var(--border);color:var(--text-dim)}
</style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb-1" id="orb1"></div>
  <div class="orb orb-2" id="orb2"></div>
  <div class="orb orb-3" id="orb3"></div>
</div>
<canvas id="confetti-canvas"></canvas>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"><i data-lucide="calculator"></i></div>
      <div><div class="brand-text">Bilab</div></div>
      <div class="brand-badge" id="brandBadge">smart</div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn lang-btn" id="langToggle" title="Language">
        <span class="fi fi-ru" id="langFlag"></span>
        <span class="lang-code" id="langCode">RU</span>
      </button>
      <button class="icon-btn" id="themeToggle" title="Theme"><i data-lucide="moon"></i></button>
    </div>
  </header>

  <div class="layout">
    <main>
      <!-- ═══ ГОТОВЫЕ СБОРКИ ═══ -->
      <section class="builds-section">
        <div class="builds-head">
          <div>
            <div class="builds-title"><i data-lucide="package-check"></i> <span id="buildsTitle"></span></div>
            <div class="builds-sub" id="buildsSub"></div>
          </div>
        </div>
        <div class="builds-grid" id="buildsGrid"></div>
      </section>

      <div class="devices-header">
        <div class="devices-count" id="devicesCount"></div>
        <div class="devices-actions">
          <button class="dev-action" id="btnSelectAll"></button>
          <button class="dev-action" id="btnSelectNone"></button>
        </div>
      </div>
      <div class="devices" id="devices"></div>
    </main>

    <aside class="sidebar">
      <div class="card summary-card">
        <div>
          <div class="field-label"><i data-lucide="wallet"></i> <span id="lblBudgetText"></span></div>
          <div class="budget-row">
            <div class="price-wrap">
              <input type="text" class="price-input" id="budgetInput" placeholder="Не задан" inputmode="decimal" autocomplete="off">
              <span class="currency">₽</span>
            </div>
          </div>
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-info">
            <span id="progressUsed">0 ₽</span>
            <span id="progressPct">—</span>
          </div>
        </div>

        <div>
          <div class="field-label"><i data-lucide="percent"></i> <span id="lblDiscountText"></span></div>
          <div class="discount-row">
            <input type="number" id="discountInput" min="0" max="90" value="0" inputmode="numeric">
            <span class="pct">%</span>
          </div>
        </div>

        <div class="divider"></div>

        <div class="total-block">
          <div class="total-label" id="lblTotalText">Итого</div>
          <div class="total-value" id="totalValue">0 <span class="rub">₽</span></div>
          <div class="total-original" id="totalOriginal" style="display:none"></div>
        </div>

        <div class="actions-primary">
          <button class="btn btn-primary" id="btnCalc" disabled><i data-lucide="sparkles"></i> <span id="btnCalcText">Рассчитать</span></button>
          <button class="btn btn-secondary" id="btnReset" title="Reset"><i data-lucide="rotate-ccw"></i></button>
        </div>

        <div class="actions-mini">
          <button class="mini-btn" id="btnShare"><i data-lucide="share-2"></i><span id="miniShareText">Ссылка</span></button>
          <button class="mini-btn" id="btnExport"><i data-lucide="download"></i><span id="miniExportText">JSON</span></button>
          <button class="mini-btn" id="btnImport"><i data-lucide="upload"></i><span id="miniImportText">Импорт</span></button>
        </div>
      </div>

      <div class="card">
        <div class="history-head">
          <h3><i data-lucide="history"></i> <span id="lblHistoryText"></span></h3>
          <button class="history-clear" id="historyClear"><span id="lblHistoryClearText"></span></button>
        </div>
        <div id="historyList"></div>
      </div>
    </aside>
  </div>

  <div class="footer-note" id="footerNote"></div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title"><i data-lucide="receipt"></i> <span id="modalTitleText"></span></div>
      <button class="modal-close" id="modalClose"><i data-lucide="x"></i></button>
    </div>

    <div class="chart-container" id="chartContainer">
      <svg class="chart-svg" viewBox="0 0 36 36"></svg>
      <div class="chart-center" id="chartCenter"></div>
    </div>

    <div class="modal-total">
      <div class="modal-total-value" id="modalTotal">0 <span class="rub">₽</span></div>
      <div class="modal-total-note" id="modalNote"></div>
    </div>
    <div class="breakdown" id="breakdown"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="modalCopy"><i data-lucide="copy"></i> <span id="modalCopyText"></span></button>
      <button class="btn btn-primary" id="modalCloseBtn"><i data-lucide="check"></i> <span id="modalDoneText"></span></button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<input type="file" id="fileInput" accept=".json" style="display:none">

let audioCtx = null;
function playSound(type){
  if (!audioCtx) { try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){return} }
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (type === 'click') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(400, now + .08);
      gain.gain.setValueAtTime(.05, now); gain.gain.exponentialRampToValueAtTime(.001, now + .08);
      osc.start(now); osc.stop(now + .08);
    } else if (type === 'success') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + .1);
      osc.frequency.setValueAtTime(783.99, now + .2);
      gain.gain.setValueAtTime(.08, now); gain.gain.linearRampToValueAtTime(0, now + .4);
      osc.start(now); osc.stop(now + .4);
    } else if (type === 'error') {
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now);
      osc.frequency.linearRampToValueAtTime(100, now + .15);
      gain.gain.setValueAtTime(.06, now); gain.gain.linearRampToValueAtTime(0, now + .15);
      osc.start(now); osc.stop(now + .15);
    }
  } catch(e){}
}

/* ═══════════ CONFETTI ═══════════ */
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
function fireConfetti(){
  particles = [];
  for (let i = 0; i < 90; i++) particles.push({
    x: window.innerWidth / 2, y: window.innerHeight / 2,
    vx: (Math.random() - .5) * 15, vy: (Math.random() - .5) * 15 - 5,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    size: Math.random() * 6 + 3, life: 1, decay: Math.random() * .02 + .01
  });
  animateConfetti();
}
function animateConfetti(){
  if (!particles.length) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.vy += .3; p.life -= p.decay;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
    return p.life > 0;
  });
  if (particles.length) requestAnimationFrame(animateConfetti);
  else ctx.clearRect(0, 0, canvas.width, canvas.height);
}

const fmt = n => Math.round(n).toLocaleString(I18N[lang].locale);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function sanitizePriceInput(v){ return String(v).replace(/[^0-9\s.,kкmмKКMМ₽]/g, ''); }
function parsePrice(raw){
  if (raw == null) return NaN;
  let s = String(raw).trim().toLowerCase().replace(/\s+/g, '').replace(/(₽|руб\.?|р\.?|\$)/g, '').replace(',', '.');
  let mult = 1;
  if (s.endsWith('k') || s.endsWith('к') || s.endsWith('тыс')) { mult = 1e3; s = s.replace(/[kк]|тыс/g, ''); }
  else if (s.endsWith('m') || s.endsWith('м') || s.endsWith('млн')) { mult = 1e6; s = s.replace(/[mм]|млн/g, ''); }
  const n = parseFloat(s);
  return (isNaN(n) || n < 0) ? NaN : n * mult;
}
function getSuggestions(id, price){
  const ranges = SUGGESTIONS[id];
  if (!ranges) return [];
  for (const r of ranges) if (price <= r.max) return r.items;
  return ranges[ranges.length - 1].items;
}
function save(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ state, budget, discount, activeBuild })); } catch(e){} }
function load(){
  try {
    const p = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (p.state) DEVICES.forEach(d => {
      const s = p.state[d.id]; if (!s) return;
      state[d.id].price = typeof s.price === 'number' ? s.price : null;
      state[d.id].qty = Math.min(99, Math.max(1, parseInt(s.qty) || 1));
      state[d.id].enabled = s.enabled !== false;
      state[d.id].img = s.img || null;
      state[d.id].name = s.name || null;
    });
    if (typeof p.budget === 'number') budget = p.budget;
    if (typeof p.discount === 'number') discount = p.discount;
    if (p.activeBuild) activeBuild = p.activeBuild;
  } catch(e){}
}

function saveHistory(){ try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch(e){} }

function toast(msg, type='info'){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icon = type === 'success' ? 'check-circle' : type === 'error' ? 'alert-circle' : 'info';
  el.innerHTML = `<i data-lucide="${icon}"></i><span>${esc(msg)}</span>`;
  toastWrap.appendChild(el); refreshIcons();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 240); }, 2400);
}

      <div class="build-img">
        <span class="build-badge ${b.tagClass}">${esc(tag)}</span>

          <div class="build-title">${esc(name)}</div>
          <div class="build-price">${fmt(b.total)} ₽</div>

      <div class="build-body">

        <div class="build-parts">${partsHtml}</div>
        <div class="build-total"><span>${esc(I18N[lang].builds.total)}</span><strong>${fmt(b.total)} ₽</strong></div>

          <i data-lucide="wand-2"></i>
          <span>${esc(I18N[lang].builds.apply)}</span>
        </button>
      </div>
    </div>`;
  }).join('');

  buildsGrid.querySelectorAll('.build-apply').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      applyBuild(btn.dataset.build);
    });
  });
  buildsGrid.querySelectorAll('.build-card').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('.build-apply')) return;
      applyBuild(card.dataset.build);
    });
  });
  refreshIcons();
}

function iconForPart(k){
  return {cpu:'cpu',gpu:'monitor',ram:'memory-stick',ssd:'hard-drive',mb:'circuit-board',psu:'plug-zap',case:'box',cooler:'fan'}[k] || 'package';
}

function applyBuild(key){
  const b = BUILDS.find(x => x.key === key);
  if (!b) return;

  DEVICES.forEach(d => {
    if (b.devices[d.id]) {
      const dev = b.devices[d.id];
      state[d.id].price = dev.price;
      state[d.id].qty = 1;
      state[d.id].enabled = true;
      state[d.id].img = dev.img || null;
      state[d.id].name = dev.name || null;
    }
  });

  activeBuild = key;
  renderBuilds();
  refreshAllInputs();
  syncEnabledClasses();
  updateCount();
  updateAll();
  save();

  playSound('success');
  fireConfetti();
  const name = lang === 'ru' ? b.name : b.nameEn;
  toast(t('toasts.buildApplied')(name), 'success');
}

        </div>
      </div>
      <div class="suggest-panel"><div class="suggest-inner"></div></div>`;
    frag.appendChild(row);

    const ref = {
      row,
      check: row.querySelector('.dev-check input'),
      price: row.querySelector('.price-input'),
      qty: row.querySelector('.qty-input'),
      hint: row.querySelector('.dev-hint'),
      badge: row.querySelector('.suggest-badge'),
      panelInner: row.querySelector('.suggest-inner')
    };
    deviceRefs[d.id] = ref;

    if (typeof state[d.id].price === 'number') {
      ref.price.value = fmt(state[d.id].price);
      row.classList.add('has-price');
    }
    ref.hint.textContent = t('hints.range')(fmt(d.min), fmt(d.max));

    ref.price.addEventListener('beforeinput', e => {
      if (e.data && !/^[0-9\s.,kкmмKКMМ₽]*$/.test(e.data)) e.preventDefault();
    });
    ref.price.addEventListener('input', e => {
      const raw = e.target.value;
      const clean = sanitizePriceInput(raw);
      if (clean !== raw) {
        const pos = e.target.selectionStart - (raw.length - clean.length);
        e.target.value = clean;
        try { e.target.setSelectionRange(Math.max(0, pos), Math.max(0, pos)); } catch(_){}
      }
      onPriceInput(d.id);
    });
    ref.price.addEventListener('paste', e => {
      const pasted = (e.clipboardData || window.clipboardData).getData('text');
      const clean = sanitizePriceInput(pasted);
      if (clean !== pasted) {
        e.preventDefault();
        const start = ref.price.selectionStart;
        const before = ref.price.value.slice(0, start);
        const after = ref.price.value.slice(ref.price.selectionEnd);
        ref.price.value = before + clean + after;
        ref.price.dispatchEvent(new Event('input', { bubbles: true }));
      }
    });
    ref.price.addEventListener('blur', () => onPriceBlur(d.id));
    ref.price.addEventListener('keydown', e => onKeyNav(e, ref.price));
    ref.qty.addEventListener('input', () => onQtyInput(d.id));
    ref.qty.addEventListener('blur', () => { ref.qty.value = state[d.id].qty; });
    ref.check.addEventListener('change', () => toggleDevice(d.id));
    ref.badge.addEventListener('click', e => { e.stopPropagation(); toggleSuggest(d.id); });

    row.querySelectorAll('.qty-btn').forEach(b => b.addEventListener('click', () => {
      playSound('click');
      let q = (parseInt(ref.qty.value) || 1) + parseInt(b.dataset.qty);
      q = Math.max(1, Math.min(99, q));
      ref.qty.value = q; state[d.id].qty = q;
      validateRow(d.id); updateAll(); save();
    }));
  });
  devices.appendChild(frag);
  refreshIcons();
  DEVICES.forEach(d => { if (state[d.id].price != null) validateRow(d.id); });
  updateCount();
}

function toggleSuggest(id){
  const r = deviceRefs[id];
  if (!r || state[id].price == null) return;
  const wasOpen = r.row.classList.contains('suggest-open');
  document.querySelectorAll('.device.suggest-open').forEach(el => el.classList.remove('suggest-open'));
  if (!wasOpen) {
    renderSuggestPanel(id);
    r.row.classList.add('suggest-open');
    playSound('click');
  }
}
function closeAllSuggest(){ document.querySelectorAll('.device.suggest-open').forEach(el => el.classList.remove('suggest-open')); }

function renderSuggestPanel(id){
  const r = deviceRefs[id];
  const price = state[id].price;
  if (!r || !price) return;
  const items = getSuggestions(id, price);
  const currentName = state[id].name;

  r.panelInner.innerHTML =
    `<div class="suggest-title"><i data-lucide="lightbulb"></i> ${t('ui.suggestTitle')(fmt(price))}</div>
     <div class="suggest-hint"><i data-lucide="mouse-pointer-click"></i> ${esc(t('pickHint'))}</div>
     <div class="suggest-list">${items.map((s, i) => {
       const [name, itemPrice, tag, img] = s;
       const isCurrent = currentName === name;
       return `<div class="suggest-item${isCurrent ? ' is-current' : ''}" data-price="${itemPrice}" data-name="${esc(name)}" data-img="${esc(img)}" style="animation-delay:${i*60}ms">
         <div class="sug-info">
           <div class="sug-name">${esc(name)}</div>
           ${tag ? `<div class="sug-tag">${esc(tag)}</div>` : ''}
         </div>
         <div class="sug-price">
           ${fmt(itemPrice)} ₽
           <i data-lucide="${isCurrent ? 'check' : 'corner-down-left'}"></i>
         </div>
       </div>`;
     }).join('')}</div>`;
  refreshIcons();

  r.panelInner.querySelectorAll('.suggest-item').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      applySuggestion(id, parseInt(el.dataset.price), el.dataset.name, el.dataset.img);
    });
  });
}

function applySuggestion(id, itemPrice, itemName, itemImg){
  const r = deviceRefs[id];
  if (!r) return;

  state[id].price = itemPrice;
  state[id].enabled = true;
  state[id].img = itemImg;
  state[id].name = itemName;
  if (!r.check.checked) r.check.checked = true;
  r.row.classList.remove('disabled');

  r.price.value = fmt(itemPrice);
  r.row.classList.add('has-price');
  r.row.classList.remove('error');
  validateRow(id);
  updateAll();
  save();
  activeBuild = null;
  renderBuilds();

  playSound('success');
  toast(t('toasts.suggestionPicked')(itemName, fmt(itemPrice)), 'success');

  setTimeout(() => { r.row.classList.remove('suggest-open'); }, 260);
}

function toggleDevice(id){
  const enabled = deviceRefs[id].check.checked;
  state[id].enabled = enabled;
  const row = deviceRefs[id].row;
  row.classList.toggle('disabled', !enabled);
  if (!enabled) row.classList.remove('suggest-open');
  playSound('click');
  validateRow(id);
  updateCount();
  updateAll();
  save();
}

function refreshAllInputs(){
  DEVICES.forEach(d => {
    const r = deviceRefs[d.id]; if (!r) return;
    r.price.value = state[d.id].price != null ? fmt(state[d.id].price) : '';
    r.qty.value = state[d.id].qty;
    r.check.checked = state[d.id].enabled;
    r.row.classList.toggle('has-price', state[d.id].price != null);
    if (r.row.classList.contains('suggest-open')) renderSuggestPanel(d.id);
    validateRow(d.id);
  });
}
function syncEnabledClasses(){
  DEVICES.forEach(d => {
    const r = deviceRefs[d.id]; if (!r) return;
    r.row.classList.toggle('disabled', !state[d.id].enabled);
    r.check.checked = state[d.id].enabled;
    if (!state[d.id].enabled) r.row.classList.remove('suggest-open');
  });
}

/* ═══════════ INPUT ═══════════ */
function onPriceInput(id){
  const r = deviceRefs[id];
  const parsed = parsePrice(r.price.value);
  state[id].price = (isNaN(parsed) || parsed <= 0) ? null : parsed;
  if (state[id].price == null) { state[id].img = null; state[id].name = null; }
  r.row.classList.remove('error');
  r.row.classList.toggle('has-price', state[id].price != null);
  if (state[id].price == null) r.row.classList.remove('suggest-open');
  validateRow(id); updateAll(); save();
}
function onPriceBlur(id){
  const r = deviceRefs[id], p = state[id].price;
  if (typeof p === 'number' && p > 0) {
    r.price.value = fmt(p);
    if (r.row.classList.contains('suggest-open')) renderSuggestPanel(id);
  }
  else if (!r.price.value.trim()) r.price.value = '';
}
function onQtyInput(id){
  const r = deviceRefs[id];
  let q = parseInt(r.qty.value);
  if (isNaN(q) || q < 1) q = 1; if (q > 99) q = 99;
  state[id].qty = q; validateRow(id); updateAll(); save();
}
function onKeyNav(e, el){
  if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    const inputs = DEVICES.filter(d => state[d.id].enabled).map(d => deviceRefs[d.id].price);
    const i = inputs.indexOf(el);
    if (i >= 0 && i < inputs.length - 1) { inputs[i + 1].focus(); inputs[i + 1].select(); }
    else { el.blur(); triggerCalculate(); }
  } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const inputs = DEVICES.filter(d => state[d.id].enabled).map(d => deviceRefs[d.id].price);
    const i = inputs.indexOf(el);
    const next = e.key === 'ArrowDown' ? i + 1 : i - 1;
    if (next >= 0 && next < inputs.length) inputs[next].focus();
  }
}

/* ═══════════ VALIDATION ═══════════ */
function validateRow(id){
  const d = DEVICES.find(x => x.id === id);
  const r = deviceRefs[id]; if (!r || !d) return;
  const p = state[id].price;
  r.row.classList.remove('error', 'filled');
  r.hint.classList.remove('error', 'active');

  if (!state[id].enabled) { r.hint.textContent = t('hints.off'); return; }
  if (p == null) { r.hint.textContent = t('hints.range')(fmt(d.min), fmt(d.max)); return; }
  r.row.classList.add('filled');

  if (p > d.max) { r.row.classList.add('error'); r.hint.classList.add('error'); r.hint.textContent = t('hints.max')(fmt(d.max)); }
  else if (p < d.min) { r.row.classList.add('error'); r.hint.classList.add('error'); r.hint.textContent = t('hints.min')(fmt(d.min)); }
  else {
    const q = state[id].qty;
    if (q > 1) { r.hint.classList.add('active'); r.hint.textContent = t('hints.qty')(q, fmt(p), fmt(p * q)); }
    else r.hint.textContent = t('hints.range')(fmt(d.min), fmt(d.max));
  }
}

/* ═══════════ COMPUTE ═══════════ */
function compute(){
  let subtotal = 0, hasError = false, hasValue = false;
  const items = [];
  for (const d of DEVICES) {
    const s = state[d.id];
    if (!s.enabled) continue;
    if (typeof s.price !== 'number' || s.price <= 0) continue;
    if (s.price < d.min || s.price > d.max) { hasError = true; continue; }
    const qty = s.qty || 1, sub = s.price * qty;
    subtotal += sub; hasValue = true;
    items.push({
      id:d.id, icon:d.icon,
      label:t('devices.' + d.id),
      price:s.price, qty, subtotal:sub,
      img:s.img || PLACEHOLDER_IMGS[d.id] || null,
      name:s.name || null
    });
  }
  items.sort((a,b) => b.subtotal - a.subtotal);
  const discountAmount = subtotal * (discount / 100);
  const total = subtotal - discountAmount;
  return { items, subtotal, discountAmount, total, hasError, hasValue };
}

/* ═══════════ UPDATE ═══════════ */
function updateCount(){
  let on = 0;
  for (const d of DEVICES) if (state[d.id].enabled) on++;
  devicesCount.innerHTML = t('ui.selectedOf')(on, DEVICES.length);
}
function updateAll(){
  const { total, subtotal, discountAmount, hasError, hasValue } = compute();
  totalValue.innerHTML = `${fmt(total)} <span class="rub">₽</span>`;
  totalValue.classList.toggle('over', budget > 0 && total > budget);

  if (discount > 0 && subtotal > 0) {
    totalOriginal.style.display = 'block';
    totalOriginal.textContent = `${t('ui.withoutDiscount')}: ${fmt(subtotal)} ₽ (−${fmt(discountAmount)} ₽)`;
  } else totalOriginal.style.display = 'none';

  if (budget > 0) {
    const pct = Math.min(100, (total / budget) * 100);
    progressFill.style.width = pct + '%';
    progressFill.classList.toggle('over', total > budget);
    progressUsed.textContent = `${fmt(total)} ₽`;
    progressPct.textContent = `${Math.round(pct)}% ${t('ui.budgetOf')} ${fmt(budget)} ₽`;
    progressPct.style.color = total > budget ? 'var(--error)' : '';
  } else {
    progressFill.style.width = '0%';
    progressFill.classList.remove('over');
    progressUsed.textContent = `${fmt(total)} ₽`;
    progressPct.textContent = t('ui.limitNotSet');
    progressPct.style.color = '';
  }
  btnCalc.disabled = hasError || !hasValue;
}

/* ═══════════ CALCULATE ═══════════ */
function triggerCalculate(){
  const { hasError, hasValue, items, total, subtotal, discountAmount } = compute();
  if (hasError) {
    document.querySelectorAll('.device.error').forEach(r => {
      r.style.animation = 'none'; void r.offsetWidth; r.style.animation = '';
    });
    toast(t('toasts.checkFields'), 'error'); playSound('error'); return;
  }
  if (!hasValue) return;
  closeAllSuggest();

  buildBreakdown(items, subtotal);
  buildChart(items, subtotal);
  modal.classList.remove('active');
  void modal.offsetWidth;
  modal.classList.add('active');

  if (discount > 0) modalNote.innerHTML = `${t('ui.discount')} ${discount}%: <strong>−${fmt(discountAmount)} ₽</strong>`;
  else if (budget > 0 && total <= budget) modalNote.innerHTML = `${lang==='ru'?'В рамках бюджета':'Within budget'} · ${lang==='ru'?'остаток':'left'} <strong>${fmt(budget - total)} ₽</strong>`;
  else modalNote.textContent = `${items.length} ${I18N[lang].plural(items.length)}`;

  animateValue(modalTotal, 0, total, 1000);
  setTimeout(() => { fireConfetti(); playSound('success'); }, 300);
  addHistory({ items, total });
}

function buildChart(items, subtotal){
  const svg = document.querySelector('.chart-svg');
  svg.innerHTML = '';
  const r = 15.9155, c = 2 * Math.PI * r;
  const count = items.length;
  const segDur = Math.max(180, Math.min(500, 1400 / Math.max(1, count)));
  let cum = 0;
  items.forEach((it, i) => {
    const p = it.subtotal / subtotal;
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', 18); circle.setAttribute('cy', 18); circle.setAttribute('r', r);
    circle.setAttribute('class', 'chart-segment');
    circle.setAttribute('stroke', COLORS[i % COLORS.length]);
    circle.setAttribute('stroke-dasharray', `${p * c} ${c}`);
    circle.setAttribute('stroke-dashoffset', -cum * c);
    circle.style.animationDuration = segDur + 'ms';
    circle.style.animationDelay = (i * segDur) + 'ms';
    svg.appendChild(circle);
    cum += p;
  });
  chartCenter.innerHTML = `${items.length}<br>${t('ui.chartPositions')}`;
}

function buildBreakdown(items, subtotal){
  if (!items.length) { breakdown.innerHTML = ''; return; }
  breakdown.innerHTML = items.map((it, i) => {
    const pct = (it.subtotal / subtotal) * 100;
    const rowDelay = i * 90;
    const barDelay = i * 90 + 220;
    const valDelay = i * 90 + 340;
    const thumbDelay = i * 90 + 100;
    const imgSrc = it.img || '';
    const altText = it.name || it.label;
    return `<div class="bd-row" style="animation-delay:${rowDelay}ms">
      <div class="bd-thumb" style="animation-delay:${thumbDelay}ms">
        ${imgSrc ? `<img src="${esc(imgSrc)}" alt="${esc(altText)}" loading="lazy" onerror="this.parentNode.innerHTML='<i data-lucide=\\'${it.icon}\\'></i>'; if(window.lucide)window.lucide.createIcons();">` : `<i data-lucide="${it.icon}"></i>`}
      </div>
      <div class="bd-main">
        <div class="bd-name">${esc(it.name || it.label)}${it.qty > 1 ? ` · ${it.qty} ${lang==='ru'?'шт':'pcs'}` : ''}</div>
        <div class="bd-bar"><div class="bd-bar-fill" style="--pct:${pct}%;animation-delay:${barDelay}ms"></div></div>
      </div>
      <div class="bd-val" style="animation-delay:${valDelay}ms">${fmt(it.subtotal)} ₽</div>
    </div>`;
  }).join('');
  refreshIcons();
}

function animateValue(obj, start, end, dur){
  if (end === 0) { obj.innerHTML = '0 <span class="rub">₽</span>'; return; }
  let ts0 = null;
  const step = ts => {
    if (!ts0) ts0 = ts;
    const p = Math.min((ts - ts0) / dur, 1), eased = 1 - Math.pow(1 - p, 4);
    const cur = Math.floor(eased * (end - start) + start);
    obj.innerHTML = `${fmt(cur)} <span class="rub">₽</span>`;
    if (p < 1) requestAnimationFrame(step);
    else obj.innerHTML = `${fmt(end)} <span class="rub">₽</span>`;
  };
  requestAnimationFrame(step);
}

/* ═══════════ HISTORY ═══════════ */
function addHistory(e){
  history.unshift({
    ts: Date.now(), total: e.total, count: e.items.length,
    items: e.items.map(i => ({ id:i.id, price:i.price, qty:i.qty, img:i.img, name:i.name })),
    enabled: Object.fromEntries(DEVICES.map(d => [d.id, state[d.id].enabled]))
  });
  if (history.length > 8) history.length = 8;
  saveHistory(); renderHistory();
}
function renderHistory(){
  if (!history.length) { historyList.innerHTML = `<div class="history-empty">${t('ui.historyEmpty')}</div>`; return; }
  historyList.innerHTML = history.map((h, i) => {
    const time = new Date(h.ts).toLocaleString(I18N[lang].locale, { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
    return `<button class="history-item" data-idx="${i}">
      <div class="hi-left">
        <div class="hi-time">${time}</div>
        <div class="hi-count">${h.count} ${I18N[lang].plural(h.count)}</div>
      </div>
      <div class="hi-total">${fmt(h.total)} ₽</div>
    </button>`;
  }).join('');
  historyList.querySelectorAll('.history-item').forEach(el => el.addEventListener('click', () => {
    playSound('click');
    const h = history[parseInt(el.dataset.idx)]; if (!h) return;
    DEVICES.forEach(d => {
      state[d.id].price = null; state[d.id].qty = 1;
      state[d.id].enabled = h.enabled ? h.enabled[d.id] !== false : true;
      state[d.id].img = null; state[d.id].name = null;
    });
    h.items.forEach(it => { if (state[it.id]) {
      state[it.id].price = it.price;
      state[it.id].qty = it.qty;
      state[it.id].img = it.img || null;
      state[it.id].name = it.name || null;
    }});
    activeBuild = null; renderBuilds();
    refreshAllInputs(); syncEnabledClasses(); updateCount(); updateAll(); save();
    toast(t('toasts.historyRestored'), 'success');
  }));
}
function clearHistory(){
  if (!history.length) return;
  if (!confirm(t('confirm.clearHistory'))) return;
  history = []; saveHistory(); renderHistory();
  toast(t('toasts.historyCleared'), 'info');
}

/* ═══════════ SHARE / EXPORT / IMPORT ═══════════ */
function shareLink(){
  const payload = { budget, discount, d: {} };
  DEVICES.forEach(d => {
    if (state[d.id].price != null || !state[d.id].enabled) {
      payload.d[d.id] = { p: state[d.id].price, q: state[d.id].qty, e: state[d.id].enabled, i: state[d.id].img, n: state[d.id].name };
    }
  });
  try {
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    const url = location.origin + location.pathname + '#s=' + b64;
    navigator.clipboard.writeText(url)
      .then(() => toast(t('toasts.linkCopied'), 'success'))
      .catch(() => prompt(t('prompt.copyLink'), url));
  } catch(e) { toast(t('toasts.shareFail'), 'error'); }
}
function tryLoadFromURL(){
  if (!location.hash.startsWith('#s=')) return;
  try {
    const p = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3)))));
    if (p.d) DEVICES.forEach(d => {
      if (p.d[d.id]) {
        state[d.id].price = p.d[d.id].p;
        state[d.id].qty = p.d[d.id].q || 1;
        state[d.id].enabled = p.d[d.id].e !== false;
        state[d.id].img = p.d[d.id].i || null;
        state[d.id].name = p.d[d.id].n || null;
      }
    });
    if (typeof p.budget === 'number') budget = p.budget;
    if (typeof p.discount === 'number') discount = p.discount;
    history.replaceState(null, '', location.pathname);
  } catch(e){}
}
function exportJSON(){
  const { items, total, subtotal, discountAmount } = compute();
  if (!items.length) { toast(t('toasts.nothingToExport'), 'error'); return; }
  const data = { generatedAt: new Date().toISOString(), lang, budget, discount, discountAmount, subtotal, total,
    items: items.map(i => ({ id:i.id, label:i.label, price:i.price, qty:i.qty, subtotal:i.subtotal, img:i.img, name:i.name })),
    enabled: Object.fromEntries(DEVICES.map(d => [d.id, state[d.id].enabled])) };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `bilab-${Date.now()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(t('toasts.exported'), 'success');
}
function handleFile(e){
  const f = e.target.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const p = JSON.parse(ev.target.result);
      if (!p.items) throw 0;
      DEVICES.forEach(d => { state[d.id].price = null; state[d.id].qty = 1; state[d.id].enabled = p.enabled ? p.enabled[d.id] !== false : true; state[d.id].img = null; state[d.id].name = null; });
      p.items.forEach(it => { if (state[it.id]) { state[it.id].price = it.price; state[it.id].qty = it.qty || 1; state[it.id].img = it.img || null; state[it.id].name = it.name || null; } });
      if (typeof p.budget === 'number') { budget = p.budget; budgetInput.value = budget ? fmt(budget) : ''; }
      if (typeof p.discount === 'number') { discount = p.discount; discountInput.value = discount; }
      activeBuild = null; renderBuilds();
      refreshAllInputs(); syncEnabledClasses(); updateCount(); updateAll(); save();
      toast(t('toasts.imported'), 'success');
    } catch(err) { toast(t('toasts.importFail'), 'error'); }
  };
  reader.readAsText(f);
  e.target.value = '';
}

/* ═══════════ RESET ═══════════ */
function resetAll(){
  const { hasValue } = compute();
  if (hasValue && !confirm(t('confirm.reset'))) return;
  DEVICES.forEach(d => { state[d.id] = { price:null, qty:1, enabled:true, img:null, name:null }; });
  budget = 0; discount = 0; activeBuild = null;
  budgetInput.value = ''; discountInput.value = '0';
  closeAllSuggest();
  renderBuilds();
  refreshAllInputs(); syncEnabledClasses(); updateCount(); updateAll(); save();
  toast(t('toasts.reset'), 'info');
}

/* ═══════════ THEME ═══════════ */
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  themeToggle.innerHTML = `<i data-lucide="${next === 'dark' ? 'moon' : 'sun'}"></i>`;
  refreshIcons();
  try { localStorage.setItem('bilab-theme', next); } catch(e){}
}
function loadTheme(){
  let th = 'dark'; try { th = localStorage.getItem('bilab-theme') || 'dark'; } catch(e){}
  document.documentElement.setAttribute('data-theme', th);
  themeToggle.innerHTML = `<i data-lucide="${th === 'dark' ? 'moon' : 'sun'}"></i>`;
}

/* ═══════════ LANG SWITCH ═══════════ */
function setLang(nl){
  lang = nl;
  try { localStorage.setItem(LANG_KEY, nl); } catch(e){}
  applyStaticTranslations();
  renderBuilds();
  renderDevices();
  renderHistory();
  const m = modal;
  if (m.classList.contains('active')) {
    const { items, subtotal, total, discountAmount } = compute();
    if (items.length) {
      buildBreakdown(items, subtotal);
      buildChart(items, subtotal);
      if (discount > 0) modalNote.innerHTML = `${t('ui.discount')} ${discount}%: <strong>−${fmt(discountAmount)} ₽</strong>`;
      else if (budget > 0 && total <= budget) modalNote.innerHTML = `${lang==='ru'?'В рамках бюджета':'Within budget'} · ${lang==='ru'?'остаток':'left'} <strong>${fmt(budget - total)} ₽</strong>`;
      else modalNote.textContent = `${items.length} ${I18N[lang].plural(items.length)}`;
      modalTotal.innerHTML = `${fmt(total)} <span class="rub">₽</span>`;
    }
  }
  if (budget > 0) budgetInput.value = fmt(budget);
  updateCount(); updateAll(); refreshIcons();
}

/* ═══════════ DOM SHORTCUTS ═══════════ */
const $ = id => document.getElementById(id);
const brandBadge = $('brandBadge'),
      buildsTitle = $('buildsTitle'), buildsSub = $('buildsSub'), buildsGrid = $('buildsGrid'),
      lblBudgetText = $('lblBudgetText'), budgetInput = $('budgetInput'),
      lblDiscountText = $('lblDiscountText'), lblTotalText = $('lblTotalText'),
      totalValue = $('totalValue'), totalOriginal = $('totalOriginal'),
      progressFill = $('progressFill'), progressUsed = $('progressUsed'), progressPct = $('progressPct'),
      btnCalc = $('btnCalc'), btnCalcText = $('btnCalcText'), btnReset = $('btnReset'),
      miniShareText = $('miniShareText'), miniExportText = $('miniExportText'), miniImportText = $('miniImportText'),
      devices = $('devices'),
      devicesCount = $('devicesCount'), btnSelectAll = $('btnSelectAll'), btnSelectNone = $('btnSelectNone'),
      historyList = $('historyList'), lblHistoryText = $('lblHistoryText'), lblHistoryClearText = $('lblHistoryClearText'),
      modal = $('modal'), modalTotal = $('modalTotal'), modalNote = $('modalNote'),
      breakdown = $('breakdown'), chartCenter = $('chartCenter'),
      modalTitleText = $('modalTitleText'), modalCopyText = $('modalCopyText'), modalDoneText = $('modalDoneText'),
      langToggle = $('langToggle'), langFlag = $('langFlag'), langCode = $('langCode'),
      themeToggle = $('themeToggle'), toastWrap = $('toastWrap'), footerNote = $('footerNote'),
      discountInput = $('discountInput'), fileInput = $('fileInput'),
      orb1 = $('orb1'), orb2 = $('orb2'), orb3 = $('orb3');

/* ═══════════ INIT ═══════════ */
loadTheme();
load();
loadHistory();
tryLoadFromURL();

lang = detectLang();
applyStaticTranslations();
renderBuilds();
renderDevices();
renderHistory();

if (budget > 0) budgetInput.value = fmt(budget);
discountInput.value = discount;

updateCount();
updateAll();
refreshIcons();

/* ═══════════ EVENTS ═══════════ */
btnSelectAll.addEventListener('click', () => {
  playSound('click');
  DEVICES.forEach(d => state[d.id].enabled = true);
  syncEnabledClasses(); updateCount(); updateAll(); save();
  toast(t('toasts.allOn'), 'success');
});
btnSelectNone.addEventListener('click', () => {
  playSound('click');
  closeAllSuggest();
  DEVICES.forEach(d => state[d.id].enabled = false);
  syncEnabledClasses(); updateCount(); updateAll(); save();
  toast(t('toasts.allOff'), 'info');
});

langToggle.addEventListener('click', () => {
  const next = lang === 'ru' ? 'en' : 'ru';
  setLang(next);
  playSound('click');
  toast(I18N[next].toasts.langChanged, 'info');
});

btnCalc.addEventListener('click', () => { playSound('click'); triggerCalculate(); });
btnReset.addEventListener('click', () => { playSound('click'); resetAll(); });
$('btnShare').addEventListener('click', shareLink);
$('btnExport').addEventListener('click', exportJSON);
$('btnImport').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', handleFile);
$('historyClear').addEventListener('click', clearHistory);
themeToggle.addEventListener('click', toggleTheme);

budgetInput.addEventListener('beforeinput', e => {
  if (e.data && !/^[0-9\s.,kкmмKКMМ₽]*$/.test(e.data)) e.preventDefault();
});
budgetInput.addEventListener('input', e => {
  const raw = e.target.value;
  const clean = sanitizePriceInput(raw);
  if (clean !== raw) {
    const pos = e.target.selectionStart - (raw.length - clean.length);
    e.target.value = clean;
    try { e.target.setSelectionRange(Math.max(0, pos), Math.max(0, pos)); } catch(_){}
  }
  const v = parsePrice(e.target.value);
  budget = isNaN(v) ? 0 : v;
  updateAll();
  save();
});
budgetInput.addEventListener('blur', () => { if (budget > 0) budgetInput.value = fmt(budget); });

discountInput.addEventListener('input', e => { let v = parseInt(e.target.value) || 0; v = Math.max(0, Math.min(90, v)); discount = v; updateAll(); save(); });
discountInput.addEventListener('blur', () => { discountInput.value = discount; });

$('modalClose').addEventListener('click', closeModal);
$('modalCloseBtn').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
function closeModal(){ modal.classList.remove('active'); }

$('modalCopy').addEventListener('click', async () => {
  const { items, total, subtotal, discountAmount } = compute(); if (!items.length) return;
  const R = I18N[lang].report;
  const lines = [R.header, ''];
  items.forEach(i => lines.push(`${i.name || i.label}${i.qty > 1 ? ` ×${i.qty}` : ''} — ${fmt(i.subtotal)} ₽`));
  lines.push('');
  if (discount > 0) { lines.push(`${R.subtotal}: ${fmt(subtotal)} ₽`); lines.push(`${R.discount} ${discount}%: −${fmt(discountAmount)} ₽`); }
  lines.push(`${R.total}: ${fmt(total)} ₽`);
  if (budget > 0) lines.push(`${R.budget}: ${fmt(budget)} ₽`);
  try { await navigator.clipboard.writeText(lines.join('\n')); toast(t('toasts.copied'), 'success'); }
  catch(e) { toast(t('toasts.copyFail'), 'error'); }
});

document.addEventListener('click', e => {
  if (!e.target.closest('.suggest-badge') && !e.target.closest('.suggest-item')) closeAllSuggest();
});

document.addEventListener('keydown', e => {
  if (e.target && e.target.matches && e.target.matches('input, textarea')) return;
  if (e.key === 'Escape') { closeModal(); closeAllSuggest(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); triggerCalculate(); }
});
</script>
</body>
</html>
